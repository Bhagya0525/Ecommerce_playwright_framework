name: E2E tests

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medusa-store
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm ci

      - name: Create the Medusa store
        run: |
          mkdir store-app
          cd store-app
          CI=true npx create-medusa-app@latest my-store --with-nextjs-starter --no-browser --db-url "postgres://postgres:postgres@localhost:5432/medusa-store"
      - name: Start the Medusa backend
        working-directory: store-app/my-store/apps/backend
        run: nohup npm run dev > "${{ github.workspace }}/backend.log" 2>&1 &

      - name: Wait for the backend to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9000/health > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 5
          done
          echo "Backend did not start. Log:"
          cat backend.log
          exit 1