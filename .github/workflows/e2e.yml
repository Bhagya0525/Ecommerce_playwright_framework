name: E2E tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medusa-store
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Create the Medusa store
        run: |
          mkdir store-app
          cd store-app
          CI=true npx create-medusa-app@latest my-store --with-nextjs-starter --no-browser --db-url "postgres://postgres:postgres@localhost:5432/medusa-store"
      - name: Start the Medusa backend
        working-directory: store-app/my-store/apps/backend
        run: nohup npm run dev > "${{ github.workspace }}/backend.log" 2>&1 &

      - name: Wait for the backend to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9000/health > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 5
          done
          echo "Backend did not start. Log:"
          cat backend.log
          exit 1
      - name: Create an admin user and read the publishable key
        working-directory: store-app/my-store/apps/backend
        run: |
          npx medusa user -e ci-admin@example.com -p ci-admin-password
          TOKEN=$(curl -s -X POST http://localhost:9000/auth/user/emailpass \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-admin@example.com","password":"ci-admin-password"}' | jq -r '.token')
          KEY=$(curl -s "http://localhost:9000/admin/api-keys?type=publishable" \
            -H "Authorization: Bearer $TOKEN" | jq -r '.api_keys[0].token')
          if [ -z "$KEY" ] || [ "$KEY" = "null" ]; then
            echo "Could not read the publishable key"
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo "MEDUSA_PUBLISHABLE_KEY=$KEY" >> "$GITHUB_ENV"
          echo "MEDUSA_API_URL=http://localhost:9000" >> "$GITHUB_ENV"

      - name: Run API tests
        if: matrix.browser == 'chromium'
        run: npx playwright test tests/api --project=chromium
      - name: Start the storefront
        working-directory: store-app/my-store/apps/storefront
        run: |
          export MEDUSA_BACKEND_URL=http://localhost:9000
          export NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY="$MEDUSA_PUBLISHABLE_KEY"
          export NEXT_PUBLIC_BASE_URL=http://localhost:8000
          export NEXT_PUBLIC_DEFAULT_REGION=dk
          nohup npm run dev > "${{ github.workspace }}/storefront.log" 2>&1 &

      - name: Wait for the storefront and warm it up
        run: |
          for i in $(seq 1 40); do
            if curl -sf --max-time 120 http://localhost:8000/dk/store > /dev/null; then
              echo "Storefront is ready"
              curl -s --max-time 120 http://localhost:8000/ > /dev/null || true
              curl -s --max-time 120 http://localhost:8000/dk/cart > /dev/null || true
              curl -s --max-time 120 http://localhost:8000/dk/products/t-shirt > /dev/null || true
              exit 0
            fi
            sleep 5
          done
          echo "Storefront did not start. Log:"
          cat storefront.log
          exit 1
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run UI and integration tests
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test tests/UI tests/integration --project=${{ matrix.browser }}

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14